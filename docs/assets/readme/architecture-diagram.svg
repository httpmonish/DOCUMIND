<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="auto" style="background:#090D14; border-radius:12px; font-family:'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="heroGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF571D" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#FF7A00" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF571D"/>
      <stop offset="100%" stop-color="#FF8A00"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <pattern id="techGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF571D"/>
    </marker>
    <marker id="arrowMint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="760" fill="#090D14" rx="12"/>
  <rect width="1200" height="760" fill="url(#techGrid)" rx="12"/>
  <rect width="1200" height="760" fill="url(#heroGlow)" rx="12"/>
  <rect x="1" y="1" width="1198" height="758" fill="none" stroke="#1E293B" stroke-width="1.5" rx="11"/>

  <!-- Top Title Banner -->
  <g transform="translate(40, 36)">
    <!-- Hexagon Logo -->
    <polygon points="18,2 32,10 32,26 18,34 4,26 4,10" fill="#161B26" stroke="#FF571D" stroke-width="2"/>
    <circle cx="18" cy="18" r="4.5" fill="#FF571D"/>
    <path d="M18 7 v6 M10 23 l4.5-2.5 M26 23 l-4.5-2.5" stroke="#E5E2E1" stroke-width="1.5" stroke-linecap="round"/>

    <text x="46" y="19" fill="#FFFFFF" font-size="18" font-weight="700" letter-spacing="0.5">DOCUMIND</text>
    <text x="160" y="19" fill="#94A3B8" font-size="13" font-weight="500">SYSTEM ARCHITECTURE &amp; DATA PIPELINE</text>
    <text x="46" y="34" fill="#64748B" font-size="11" font-family="'JetBrains Mono', monospace">TOPOLOGY: DETERMINISTIC RETRIEVAL &amp; GROUNDED RELEVANCE GATING</text>
    
    <!-- Badges in top right -->
    <g transform="translate(860, 0)">
      <rect x="0" y="4" width="115" height="24" rx="4" fill="#161D2C" stroke="#253248" stroke-width="1"/>
      <circle cx="12" cy="16" r="4" fill="#10B981"/>
      <text x="22" y="20" fill="#94A3B8" font-size="10.5" font-weight="600" font-family="'JetBrains Mono', monospace">TAU = 0.35 GATE</text>

      <rect x="125" y="4" width="125" height="24" rx="4" fill="#161D2C" stroke="#253248" stroke-width="1"/>
      <circle cx="137" cy="16" r="4" fill="#FF571D"/>
      <text x="147" y="20" fill="#94A3B8" font-size="10.5" font-weight="600" font-family="'JetBrains Mono', monospace">STDIO MCP v0.7.0</text>
    </g>
  </g>

  <!-- SECTION 1: INGESTION PIPELINE (TOP LEFT / CENTER) -->
  <g transform="translate(40, 95)">
    <!-- Container Box -->
    <rect width="1120" height="175" rx="8" fill="#0D131F" stroke="#1E293B" stroke-width="1.2" filter="url(#shadow)"/>
    
    <!-- Section Label -->
    <rect x="16" y="-10" width="220" height="20" rx="4" fill="#1A2333" stroke="#FF571D" stroke-width="1"/>
    <text x="26" y="4" fill="#FF8A00" font-size="10.5" font-weight="700" font-family="'JetBrains Mono', monospace">1. INGESTION &amp; VECTOR PIPELINE</text>

    <!-- Stage 1.1: Document Input -->
    <g transform="translate(24, 30)">
      <rect width="160" height="115" rx="6" fill="#131B2B" stroke="#2B3A52" stroke-width="1"/>
      <text x="14" y="24" fill="#E2E8F0" font-size="12" font-weight="600">Document Upload</text>
      <text x="14" y="42" fill="#94A3B8" font-size="10.5">PDF · TXT · Markdown</text>
      <path d="M 14 54 L 146 54" stroke="#202D42" stroke-width="1"/>
      <text x="14" y="72" fill="#64748B" font-size="9.5" font-family="'JetBrains Mono', monospace">SHA-256 Checksum</text>
      <text x="14" y="88" fill="#64748B" font-size="9.5" font-family="'JetBrains Mono', monospace">Magic Byte Header</text>
      <text x="14" y="104" fill="#FF8A00" font-size="9.5" font-family="'JetBrains Mono', monospace">Buffer &lt;= 50MB</text>
    </g>

    <!-- Flow Arrow -->
    <path d="M 194 88 L 220 88" stroke="#FF571D" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

    <!-- Stage 1.2: POSIX Sandboxed Extraction -->
    <g transform="translate(230, 30)">
      <rect width="180" height="115" rx="6" fill="#131B2B" stroke="#2B3A52" stroke-width="1"/>
      <text x="14" y="24" fill="#E2E8F0" font-size="12" font-weight="600">Subprocess Sandbox</text>
      <text x="14" y="42" fill="#94A3B8" font-size="10.5">Isolated Text Extraction</text>
      <path d="M 14 54 L 166 54" stroke="#202D42" stroke-width="1"/>
      <text x="14" y="72" fill="#64748B" font-size="9.5" font-family="'JetBrains Mono', monospace">resource.RLIMIT_AS</text>
      <text x="14" y="88" fill="#64748B" font-size="9.5" font-family="'JetBrains Mono', monospace">60s Process Timeout</text>
      <text x="14" y="104" fill="#10B981" font-size="9.5" font-family="'JetBrains Mono', monospace">500-Page Hard Cap</text>
    </g>

    <!-- Flow Arrow -->
    <path d="M 420 88 L 446 88" stroke="#FF571D" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

    <!-- Stage 1.3: Sliding Window Chunking -->
    <g transform="translate(456, 30)">
      <rect width="180" height="115" rx="6" fill="#131B2B" stroke="#2B3A52" stroke-width="1"/>
      <text x="14" y="24" fill="#E2E8F0" font-size="12" font-weight="600">Sliding Window</text>
      <text x="14" y="42" fill="#94A3B8" font-size="10.5">Sentence Boundary Preservation</text>
      <path d="M 14 54 L 166 54" stroke="#202D42" stroke-width="1"/>
      <text x="14" y="72" fill="#64748B" font-size="9.5" font-family="'JetBrains Mono', monospace">Window: 200 Words</text>
      <text x="14" y="88" fill="#64748B" font-size="9.5" font-family="'JetBrains Mono', monospace">Overlap: 30 Words</text>
      <text x="14" y="104" fill="#10B981" font-size="9.5" font-family="'JetBrains Mono', monospace">no_gold = 0 Deficit</text>
    </g>

    <!-- Flow Arrow -->
    <path d="M 646 88 L 672 88" stroke="#FF571D" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

    <!-- Stage 1.4: Dense Embedder -->
    <g transform="translate(682, 30)">
      <rect width="185" height="115" rx="6" fill="#131B2B" stroke="#2B3A52" stroke-width="1"/>
      <text x="14" y="24" fill="#E2E8F0" font-size="12" font-weight="600">Dense Bi-Encoder</text>
      <text x="14" y="42" fill="#94A3B8" font-size="10.5">BAAI/bge-small-en-v1.5</text>
      <path d="M 14 54 L 171 54" stroke="#202D42" stroke-width="1"/>
      <text x="14" y="72" fill="#64748B" font-size="9.5" font-family="'JetBrains Mono', monospace">384 Dimensions</text>
      <text x="14" y="88" fill="#64748B" font-size="9.5" font-family="'JetBrains Mono', monospace">L2 Unit Normalization</text>
      <text x="14" y="104" fill="#60A5FA" font-size="9.5" font-family="'JetBrains Mono', monospace">Local Torch / ONNX</text>
    </g>

    <!-- Flow Arrow -->
    <path d="M 877 88 L 903 88" stroke="#FF571D" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

    <!-- Stage 1.5: Atomic Persistent Store -->
    <g transform="translate(913, 30)">
      <rect width="180" height="115" rx="6" fill="#131B2B" stroke="#2B3A52" stroke-width="1"/>
      <text x="14" y="24" fill="#E2E8F0" font-size="12" font-weight="600">Vector Storage</text>
      <text x="14" y="42" fill="#94A3B8" font-size="10.5">ChromaDB / NumpyStore</text>
      <path d="M 14 54 L 166 54" stroke="#202D42" stroke-width="1"/>
      <text x="14" y="72" fill="#64748B" font-size="9.5" font-family="'JetBrains Mono', monospace">Monotonic Insert</text>
      <text x="14" y="88" fill="#64748B" font-size="9.5" font-family="'JetBrains Mono', monospace">Chunk 0 Commit Mark</text>
      <text x="14" y="104" fill="#34D399" font-size="9.5" font-family="'JetBrains Mono', monospace">~/.documind/ Storage</text>
    </g>
  </g>

  <!-- SECTION 2: ACCESS SURFACES & PROTOCOLS (MIDDLE LEFT) -->
  <g transform="translate(40, 295)">
    <rect width="470" height="235" rx="8" fill="#0D131F" stroke="#1E293B" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="16" y="-10" width="230" height="20" rx="4" fill="#1A2333" stroke="#3B82F6" stroke-width="1"/>
    <text x="26" y="4" fill="#60A5FA" font-size="10.5" font-weight="700" font-family="'JetBrains Mono', monospace">2. INTERFACES &amp; ACCESS GATES</text>

    <!-- Grid of Interfaces -->
    <!-- CLI & MCP -->
    <g transform="translate(20, 26)">
      <rect width="205" height="88" rx="6" fill="#131B2B" stroke="#2B3A52" stroke-width="1"/>
      <text x="12" y="22" fill="#E2E8F0" font-size="11.5" font-weight="600">Model Context Protocol</text>
      <text x="12" y="38" fill="#60A5FA" font-size="10" font-family="'JetBrains Mono', monospace">stdio transport (v0.7.0)</text>
      <text x="12" y="56" fill="#94A3B8" font-size="9.5">Claude Desktop &amp; Claude Code</text>
      <text x="12" y="74" fill="#34D399" font-size="9.5" font-family="'JetBrains Mono', monospace">4 Tools · 0 Internal LLM</text>
    </g>

    <g transform="translate(245, 26)">
      <rect width="205" height="88" rx="6" fill="#131B2B" stroke="#2B3A52" stroke-width="1"/>
      <text x="12" y="22" fill="#E2E8F0" font-size="11.5" font-weight="600">CLI &amp; Stream Discipline</text>
      <text x="12" y="38" fill="#FF8A00" font-size="10" font-family="'JetBrains Mono', monospace">documind ask / search</text>
      <text x="12" y="56" fill="#94A3B8" font-size="9.5">JSON &amp; Answers -> stdout</text>
      <text x="12" y="74" fill="#64748B" font-size="9.5" font-family="'JetBrains Mono', monospace">Logs / Telemetry -> stderr</text>
    </g>

    <!-- Public Demo vs Admin API -->
    <g transform="translate(20, 128)">
      <rect width="205" height="90" rx="6" fill="#131B2B" stroke="#2B3A52" stroke-width="1"/>
      <text x="12" y="22" fill="#E2E8F0" font-size="11.5" font-weight="600">Public Demo Gateway</text>
      <text x="12" y="38" fill="#34D399" font-size="10" font-family="'JetBrains Mono', monospace">POST /api/demo/*</text>
      <text x="12" y="56" fill="#94A3B8" font-size="9.5">Server-Issued Session Hash</text>
      <text x="12" y="74" fill="#64748B" font-size="9.5" font-family="'JetBrains Mono', monospace">Isolated SQLite &amp; Chunks</text>
    </g>

    <g transform="translate(245, 128)">
      <rect width="205" height="90" rx="6" fill="#131B2B" stroke="#2B3A52" stroke-width="1"/>
      <text x="12" y="22" fill="#E2E8F0" font-size="11.5" font-weight="600">Admin Microservices</text>
      <text x="12" y="38" fill="#F87171" font-size="10" font-family="'JetBrains Mono', monospace">POST /v1/* (Protected)</text>
      <text x="12" y="56" fill="#94A3B8" font-size="9.5">X-API-Key (len &gt;= 32 chars)</text>
      <text x="12" y="74" fill="#64748B" font-size="9.5" font-family="'JetBrains Mono', monospace">hmac.compare_digest</text>
    </g>
  </g>

  <!-- SECTION 3: RELEVANCE GATE & GROUNDING ENGINE (MIDDLE RIGHT) -->
  <g transform="translate(535, 295)">
    <rect width="625" height="235" rx="8" fill="#0D131F" stroke="#1E293B" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="16" y="-10" width="280" height="20" rx="4" fill="#1A2333" stroke="#10B981" stroke-width="1"/>
    <text x="26" y="4" fill="#34D399" font-size="10.5" font-weight="700" font-family="'JetBrains Mono', monospace">3. DETERMINISTIC RELEVANCE GATE</text>

    <!-- Query Vector Retrieval -->
    <g transform="translate(20, 26)">
      <rect width="170" height="90" rx="6" fill="#131B2B" stroke="#2B3A52" stroke-width="1"/>
      <text x="12" y="22" fill="#E2E8F0" font-size="11.5" font-weight="600">Dense Retrieval</text>
      <text x="12" y="38" fill="#60A5FA" font-size="10" font-family="'JetBrains Mono', monospace">Bi-Encoder Cosine</text>
      <text x="12" y="56" fill="#94A3B8" font-size="9.5">Top-k Candidate Chunks</text>
      <text x="12" y="74" fill="#34D399" font-size="9.5" font-family="'JetBrains Mono', monospace">p50 Latency: 4.8 ms</text>
    </g>

    <!-- Gate Decision Block -->
    <path d="M 198 71 L 222 71" stroke="#FF571D" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

    <g transform="translate(228, 22)">
      <polygon points="55,0 110,48 55,96 0,48" fill="#1A2234" stroke="#FF7A00" stroke-width="1.5"/>
      <text x="55" y="42" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">RELEVANCE</text>
      <text x="55" y="56" fill="#FF8A00" font-size="10" font-weight="700" text-anchor="middle">TAU &gt;= 0.35</text>
    </g>

    <!-- Branch A: Passed Gate -> Grounded Answer -->
    <path d="M 346 45 L 390 45" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrowMint)"/>
    <g transform="translate(398, 22)">
      <rect width="205" height="96" rx="6" fill="#0C251C" stroke="#10B981" stroke-width="1.2"/>
      <text x="12" y="20" fill="#34D399" font-size="11" font-weight="700">GROUNDED OUTCOME</text>
      <text x="12" y="36" fill="#E2E8F0" font-size="9.5">Score &gt;= 0.35: Evidence Passed</text>
      <text x="12" y="52" fill="#94A3B8" font-size="9.5">Context Assembly + Condenser</text>
      <text x="12" y="68" fill="#E2E8F0" font-size="9.5" font-family="'JetBrains Mono', monospace">Answer with [S1], [S2] tags</text>
      <text x="12" y="86" fill="#34D399" font-size="9" font-family="'JetBrains Mono', monospace">Exit Code 0 · 100% Grounded</text>
    </g>

    <!-- Branch B: Failed Gate -> Deterministic Abstention -->
    <path d="M 283 124 L 283 150 L 390 150" stroke="#F87171" stroke-width="1.5" marker-end="url(#arrowGray)"/>
    <g transform="translate(398, 126)">
      <rect width="205" height="90" rx="6" fill="#241315" stroke="#F87171" stroke-width="1.2"/>
      <text x="12" y="20" fill="#F87171" font-size="11" font-weight="700">ABSTENTION OUTCOME</text>
      <text x="12" y="36" fill="#E2E8F0" font-size="9.5">Score &lt; 0.35: Insufficient Evidence</text>
      <text x="12" y="52" fill="#94A3B8" font-size="9.5">No LLM Call · Zero Hallucination</text>
      <text x="12" y="68" fill="#F87171" font-size="9.5" font-family="'JetBrains Mono', monospace">Exit Code 3 (Clean Abstain)</text>
      <text x="12" y="84" fill="#94A3B8" font-size="9" font-family="'JetBrains Mono', monospace">Off-Topic Abstain: 100% (5/5)</text>
    </g>
  </g>

  <!-- SECTION 4: PRODUCTION GUARDRAILS & MONITORING (BOTTOM FULL) -->
  <g transform="translate(40, 550)">
    <rect width="1120" height="165" rx="8" fill="#0D131F" stroke="#1E293B" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="16" y="-10" width="290" height="20" rx="4" fill="#1A2333" stroke="#818CF8" stroke-width="1"/>
    <text x="26" y="4" fill="#A5B4FC" font-size="10.5" font-weight="700" font-family="'JetBrains Mono', monospace">4. OPERATIONAL GUARDS &amp; GLASS BOX UI</text>

    <!-- Guard 1: Spend Ledger -->
    <g transform="translate(24, 25)">
      <rect width="250" height="115" rx="6" fill="#131B2B" stroke="#2B3A52" stroke-width="1"/>
      <text x="14" y="22" fill="#E2E8F0" font-size="12" font-weight="600">Two-Phase Spend Ledger</text>
      <text x="14" y="38" fill="#FBBF24" font-size="10" font-family="'JetBrains Mono', monospace">Atomic Pre-Allocation</text>
      <path d="M 14 48 L 236 48" stroke="#202D42" stroke-width="1"/>
      <text x="14" y="66" fill="#94A3B8" font-size="9.5">Global Cap: $2.00 / day</text>
      <text x="14" y="84" fill="#94A3B8" font-size="9.5">Visitor Cap: $0.25 / day / IP</text>
      <text x="14" y="102" fill="#34D399" font-size="9.5" font-family="'JetBrains Mono', monospace">Fails Closed to Retrieval-Only</text>
    </g>

    <!-- Guard 2: Token-Bucket Rate Limiter -->
    <g transform="translate(298, 25)">
      <rect width="250" height="115" rx="6" fill="#131B2B" stroke="#2B3A52" stroke-width="1"/>
      <text x="14" y="22" fill="#E2E8F0" font-size="12" font-weight="600">Rate Limiting &amp; Quotas</text>
      <text x="14" y="38" fill="#60A5FA" font-size="10" font-family="'JetBrains Mono', monospace">IPv6 /64 Subnet Aggregation</text>
      <path d="M 14 48 L 236 48" stroke="#202D42" stroke-width="1"/>
      <text x="14" y="66" fill="#94A3B8" font-size="9.5">10 Ask Requests / min</text>
      <text x="14" y="84" fill="#94A3B8" font-size="9.5">5 Ingestion Uploads / hr</text>
      <text x="14" y="102" fill="#34D399" font-size="9.5" font-family="'JetBrains Mono', monospace">5 Anonymous Sessions / hr</text>
    </g>

    <!-- Glass Box UI Surface Overview -->
    <g transform="translate(572, 25)">
      <rect width="524" height="115" rx="6" fill="#131B2B" stroke="#2B3A52" stroke-width="1"/>
      <text x="16" y="22" fill="#E2E8F0" font-size="12" font-weight="600">Built-in Glass Box Web UI (Mounted at /app)</text>
      <text x="16" y="38" fill="#94A3B8" font-size="10">Zero-configuration administrative &amp; visitor telemetry console</text>
      <path d="M 16 48 L 508 48" stroke="#202D42" stroke-width="1"/>

      <g transform="translate(16, 60)">
        <rect width="112" height="46" rx="4" fill="#182338" stroke="#2B3A52" stroke-width="1"/>
        <text x="10" y="18" fill="#E2E8F0" font-size="10.5" font-weight="600">/app/console</text>
        <text x="10" y="34" fill="#94A3B8" font-size="9">Query &amp; Citations</text>
      </g>
      <g transform="translate(138, 60)">
        <rect width="112" height="46" rx="4" fill="#182338" stroke="#2B3A52" stroke-width="1"/>
        <text x="10" y="18" fill="#E2E8F0" font-size="10.5" font-weight="600">/app/library</text>
        <text x="10" y="34" fill="#94A3B8" font-size="9">Drag &amp; Chunk Audit</text>
      </g>
      <g transform="translate(260, 60)">
        <rect width="112" height="46" rx="4" fill="#182338" stroke="#2B3A52" stroke-width="1"/>
        <text x="10" y="18" fill="#E2E8F0" font-size="10.5" font-weight="600">/app/architecture</text>
        <text x="10" y="34" fill="#94A3B8" font-size="9">3D Pipeline Sim</text>
      </g>
      <g transform="translate(382, 60)">
        <rect width="126" height="46" rx="4" fill="#182338" stroke="#2B3A52" stroke-width="1"/>
        <text x="10" y="18" fill="#E2E8F0" font-size="10.5" font-weight="600">/app/proof</text>
        <text x="10" y="34" fill="#94A3B8" font-size="9">SQuAD &amp; Mitigation</text>
      </g>
    </g>
  </g>
</svg>
