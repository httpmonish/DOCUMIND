version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: documind:latest
    container_name: documind-app
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      - DOCUMIND_ENV=production
      - DOCUMIND_HOME=/app/data
      - DOCUMIND_SECRET_KEY=${DOCUMIND_SECRET_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DOCUMIND_DISABLE_DOCS=1
    volumes:
      - documind_data:/app/data:rw
      - documind_tmp:/app/tmp:rw
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal_net

  caddy:
    image: caddy:2-alpine
    container_name: documind-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOCUMIND_DOMAIN=${DOCUMIND_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal_net

volumes:
  documind_data:
  documind_tmp:
  caddy_data:
  caddy_config:

networks:
  internal_net:
    driver: bridge
