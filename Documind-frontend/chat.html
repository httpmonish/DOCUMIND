<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocuMind — Document Intelligence Chat</title>
  <meta http-equiv="refresh" content="0; url=console/code.html?chat=open">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="chat-drawer.css">
  <style>
    body {
      background-color: #0e0e0e;
      color: #e5e2e1;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .redirect-card {
      background: #1c1b1b;
      border: 1px solid #353534;
      border-radius: 8px;
      padding: 32px 48px;
      max-width: 440px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .brand-icon {
      width: 40px;
      height: 40px;
      margin: 0 auto 16px;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    p {
      color: #8e8a88;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    a.btn {
      display: inline-block;
      background: #ff571d;
      color: #531200;
      font-weight: 600;
      font-size: 13px;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 6px;
      transition: background 0.15s ease;
    }
    a.btn:hover {
      background: #ffb59f;
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <svg class="brand-icon" viewBox="0 0 32 32" fill="none">
      <polygon points="16,2 29,9.5 29,24.5 16,32 3,24.5 3,9.5" fill="#201f1f" stroke="#ff571d" stroke-width="2"/>
      <circle cx="16" cy="17" r="4.5" fill="#ff571d"/>
      <path d="M16 6v6.5M8.5 21.5l5.5-3M23.5 21.5l-5.5-3" stroke="#e5e2e1" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <h1>Connecting to DocuMind Chat</h1>
    <p>Opening the canonical document chat panel in your active workspace...</p>
    <a href="console/code.html?chat=open" class="btn" id="btn-attach">Launch Chat Console ↗</a>
  </div>

  <!-- Compatibility fallback mount points for standalone consumers -->
  <div style="display: none;" id="message-stream" aria-hidden="true"></div>
  <div style="display: none;" id="chat-input" aria-hidden="true"></div>
  <div style="display: none;" id="citation-drawer" aria-hidden="true"></div>

  <script src="api.js"></script>
  <script src="chat-drawer.js"></script>
  <script>
    if (typeof window !== "undefined") {
      window.location.replace("console/code.html?chat=open");
    }
  </script>
</body>
</html>
