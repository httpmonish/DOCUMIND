name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,embed]" --extra-index-url https://download.pytorch.org/whl/cpu
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy documind
      - run: pytest -m "not slow" --cov=documind --cov-fail-under=85
      - run: pip-audit
