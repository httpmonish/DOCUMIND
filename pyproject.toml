[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "documind"
version = "0.7.0"
description = "Ask questions about your own PDFs, text and markdown files and get cited, grounded answers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "pypdf>=6.14.2,<7",
  "chromadb>=1.5.5,<2",
  "python-dotenv>=1.0,<2",
  "numpy>=1.26",
  "anthropic>=1.0.0,<2",
]

[project.scripts]
documind = "documind.interfaces.cli:main"

[project.optional-dependencies]
embed = ["sentence-transformers>=6.0.1,<7"]
api = [
  "fastapi>=0.136.1",
  "starlette>=1.0.1",
  "uvicorn>=0.30.0",
  "python-multipart>=0.0.12",
]
mcp = ["mcp>=1.29.0,<2"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pip-audit>=2.7",
  "build>=1.2",
  "mcp>=1.29.0,<2",
]

[tool.setuptools.packages.find]
include = ["documind*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "PTH", "T201"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "T201"]
"scripts/**" = ["T201"]
"examples/**" = ["T201"]
"evals/**" = ["T201"]
"documind/core/_extract_worker.py" = ["T201"]
"documind/interfaces/api.py" = ["T201", "E501", "B904"]
"documind/interfaces/auth.py" = ["T201", "E501"]
"documind/interfaces/cli.py" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["documind"]

[[tool.mypy.overrides]]
module = ["chromadb.*", "sentence_transformers.*", "pypdf.*", "razorpay.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "slow: loads the real embedding model (deselect with -m 'not slow')",
  "live: runs live API calls (costs money; deselect with -m 'not live')",
  "asyncio: mark test as asynchronous coroutine",
]
addopts = "-q"
